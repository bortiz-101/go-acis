server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript application/json text/css text/plain;

    # The browser always checks for the newest Angular entry point.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Angular gives production assets content hashes, so they can be cached safely.
    location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Current API endpoint.
    location = /health {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Future API endpoints can live under /api without changing Angular's origin.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve files when present; otherwise let Angular handle the client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
