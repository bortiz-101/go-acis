---
name: Go Dependency Updates

on:
  schedule:
    # Run at 09:00 UTC on the first day of every month
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: go-dependency-updates
  cancel-in-progress: false

jobs:
  update:
    name: Update Go & Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up latest stable Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          check-latest: true
          cache: true

      - name: Update Go version
        run: go get go@latest

      - name: Update dependencies
        run: go get -u ./...

      - name: Tidy Go modules
        run: go mod tidy

      - name: Verify dependencies
        run: go mod verify

      # - name: Run unit tests
      #  run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build server binary
        run: |
          mkdir -p bin
          go build -v -o bin/server ./cmd/go_acis

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/go-dependency-updates
          delete-branch: true
          add-paths: |
            go.mod
            go.sum
          commit-message: "chore: update Go and dependencies"
          title: "chore: monthly Go and dependency updates"
          body: |
            ## Automated Go maintenance

            This PR was generated automatically.

            ### Changes
            - Updated Go to the latest stable release.
            - Updated Go dependencies.
            - Ran go mod tidy.
            - Verified dependencies.
            - Built the server binary.

            Please review dependency changes and potential breaking changes
            before merging.

  notify-discord:
    name: Discord Notification
    runs-on: ubuntu-latest

    needs:
      - update

    if: always()

    steps:
      - name: Send dependency update result to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          UPDATE_RESULT: ${{ needs.update.result }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "Discord webhook secret is not configured."
            exit 0
          fi

          case "$UPDATE_RESULT" in
            success)
              STATUS="SUCCESS"
              COLOR=5763719
              DESCRIPTION="Go dependency update completed successfully."
              ;;
            failure)
              STATUS="FAILED"
              COLOR=15548997
              DESCRIPTION="Go dependency update encountered an error."
              ;;
            cancelled)
              STATUS="CANCELLED"
              COLOR=16753920
              DESCRIPTION="Go dependency update was cancelled."
              ;;
            *)
              STATUS="UNKNOWN"
              COLOR=9807270
              DESCRIPTION="Go dependency update finished with status: $UPDATE_RESULT"
              ;;
          esac

          PAYLOAD=$(jq -n \
            --arg title "Go Dependency Updates: $STATUS" \
            --arg description "$DESCRIPTION" \
            --arg repo "$REPOSITORY" \
            --arg actor "$ACTOR" \
            --arg event "$EVENT" \
            --arg result "$UPDATE_RESULT" \
            --arg url "$RUN_URL" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                description: $description,
                color: $color,
                fields: [
                  {
                    name: "Repository",
                    value: $repo,
                    inline: true
                  },
                  {
                    name: "Triggered by",
                    value: $actor,
                    inline: true
                  },
                  {
                    name: "Trigger",
                    value: $event,
                    inline: true
                  },
                  {
                    name: "Job Result",
                    value: $result,
                    inline: true
                  }
                ],
                url: $url,
                footer: {
                  text: "GitHub Actions • Dependency Maintenance"
                },
                timestamp: (now | todate)
              }]
            }')

          echo "$PAYLOAD" | jq empty

          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"

          echo "Discord notification sent: $STATUS"
